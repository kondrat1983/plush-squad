<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Plush Squad</title>
<meta name="description" content="Jack the plush dragon vs pillow-fighting rivals, from Pillow Hills to Space.">
<meta name="theme-color" content="#1d2163">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plush Squad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:Poppins;src:url(assets/Poppins-Bold.ttf) format("truetype");font-weight:700;font-display:block}
@font-face{font-family:Poppins;src:url(assets/Poppins-Medium.ttf) format("truetype");font-weight:500;font-display:block}
html,body{margin:0;height:100%;background:#1d2163;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* the game fills the whole screen; #safe only measures the iPhone safe areas (status bar, home bar, notch) for the game layout */
#game{position:fixed;left:0;top:0;right:0;bottom:0}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#game canvas{display:block}
.pre{position:fixed;left:-999px;font-family:Poppins}
</style>
</head>
<body>
<div id="game"></div><div id="safe"></div>
<span class="pre" style="font-weight:700">.</span><span class="pre" style="font-weight:500">.</span>
<script src="vendor/phaser.min.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/toys.js"></script>
<script src="js/extra.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    // a new version just took over: reload once so the player sees it right away
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () {});
  });
}
</script>
</body>
</html>
