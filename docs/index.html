<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plush Squad Docs</title>
  <meta name="description" content="Plush Squad game design document, decisions, ideas, design docs and QA reports.">
  <link rel="icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #4a50b8; }
    body { -webkit-text-size-adjust: 100%; }
    .markdown-section { max-width: 900px; }
    .markdown-section table { display: block; overflow-x: auto; }
    .sidebar .app-name-link img { width: 48px; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    // The pages are read straight from the repo's main branch on GitHub, not through the game's
    // service worker (it caches files under this site for offline play, which would show old docs).
    window.$docsify = {
      name: '<img src="../assets/icon-192.png" alt=""> Plush Squad',
      repo: 'kondrat1983/plush-squad',
      basePath: 'https://raw.githubusercontent.com/kondrat1983/plush-squad/main/docs/',
      homepage: 'README.md',
      loadSidebar: '_sidebar.md',
      relativePath: true,
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Search', noData: 'Nothing found', depth: 3 },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
